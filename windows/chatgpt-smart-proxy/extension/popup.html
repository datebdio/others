<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChatGPT 智能代理</title>
<style>
*{box-sizing:border-box}body{width:390px;margin:0;background:#f4f5f7;color:#171717;font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;font-size:13px}.wrap{padding:14px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.brand{display:flex;align-items:baseline;gap:7px}.title{font-size:18px;font-weight:750}.ver{font-size:11px;color:#8b8d91}.card{background:#fff;border:1px solid #e3e5e8;border-radius:12px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.025)}.status-card{padding:12px}.status-line{display:flex;align-items:center;justify-content:space-between;gap:10px}.status-main{display:flex;align-items:center;gap:8px;min-width:0}.dot{width:9px;height:9px;border-radius:50%;background:#a4a7ad;flex:none}.dot.ok{background:#18a05e}.dot.bad{background:#d84a4a}.dot.warn{background:#e2a216}.status-text{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.muted{font-size:11.5px;color:#777b82;margin-top:5px;line-height:1.45}.switch{position:relative;width:42px;height:24px;flex:none}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;inset:0;background:#c9ccd1;border-radius:99px;cursor:pointer;transition:.15s}.slider:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.15s}.switch input:checked+.slider{background:#171717}.switch input:checked+.slider:before{transform:translateX(18px)}.switch input:disabled+.slider{opacity:.5;cursor:default}.section-head{display:flex;align-items:center;justify-content:space-between;padding:11px 12px 8px}.section-title{font-weight:750}.add-btn{border:0;background:transparent;color:#171717;font:inherit;font-weight:700;cursor:pointer;padding:3px 0}.node-list{padding:0 7px 7px}.empty{padding:18px 10px 20px;text-align:center;color:#85888e;font-size:12px}.node-row{position:relative;display:flex;align-items:center;gap:9px;padding:9px 8px;border-radius:9px;cursor:pointer}.node-row:hover{background:#f6f7f8}.node-row.selected{background:#f1f2f4}.radio{width:15px;height:15px;border:1.5px solid #a8abb0;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}.selected .radio{border-color:#171717}.selected .radio:after{content:"";width:7px;height:7px;background:#171717;border-radius:50%}.node-main{min-width:0;flex:1}.node-name{font-weight:680;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.node-meta{font-size:10.5px;color:#878a90;margin-top:2px;text-transform:uppercase}.latency{font-size:11px;color:#65686e;min-width:45px;text-align:right}.more{border:0;background:transparent;font-size:20px;line-height:20px;width:24px;height:25px;padding:0;color:#555;cursor:pointer;border-radius:6px}.more:hover{background:#e4e6e9}.node-menu{display:none;position:absolute;right:7px;top:37px;z-index:20;width:94px;background:#fff;border:1px solid #dddfe3;border-radius:9px;padding:4px;box-shadow:0 7px 24px rgba(0,0,0,.13)}.node-menu.open{display:block}.node-menu button{display:block;width:100%;border:0;background:transparent;text-align:left;padding:7px 8px;border-radius:6px;font:inherit;font-size:12px;cursor:pointer}.node-menu button:hover{background:#f1f2f4}.node-menu button.danger{color:#bd302a}.mode-card{padding:11px 12px}.mode-row{display:flex;align-items:center;justify-content:space-between;gap:12px}.mode-row label{font-weight:700;white-space:nowrap}select,input,textarea{font:inherit;border:1px solid #d7d9dd;border-radius:8px;background:#fff;outline:none}select{padding:7px 28px 7px 8px;max-width:215px}input:focus,textarea:focus,select:focus{border-color:#8b8e94}.toast{min-height:18px;padding:0 3px 2px;font-size:11.5px;color:#65686e;white-space:pre-wrap}.toast.ok{color:#16784b}.toast.err{color:#b72e28}.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.26);z-index:50;padding:18px;align-items:center;justify-content:center}.overlay.open{display:flex}.editor{width:100%;background:#fff;border-radius:13px;padding:14px;box-shadow:0 18px 55px rgba(0,0,0,.2)}.editor-title{font-size:16px;font-weight:750;margin-bottom:12px}.field{margin-bottom:10px}.field label{display:block;font-size:11.5px;font-weight:700;margin-bottom:5px}.field input,.field textarea{width:100%;padding:8px}.field textarea{height:125px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:10.5px;word-break:break-all}.hint{font-size:10.5px;color:#85888e;margin-top:4px;line-height:1.4}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.btn{border:0;border-radius:8px;padding:8px 13px;font:inherit;font-weight:700;cursor:pointer}.btn.primary{background:#171717;color:#fff}.btn.secondary{background:#eceef1;color:#252525}.btn:disabled{opacity:.5;cursor:default}.footer{font-size:10.5px;color:#9a9da2;text-align:center;padding:2px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><div class="title">ChatGPT 智能代理</div><div class="ver">v0.2</div></div>
  </div>

  <div class="card status-card">
    <div class="status-line">
      <div class="status-main"><span id="dot" class="dot"></span><span id="statusText" class="status-text">检测本地程序…</span></div>
      <label class="switch" title="代理总开关"><input id="master" type="checkbox"><span class="slider"></span></label>
    </div>
    <div id="statusDetail" class="muted">正在读取状态</div>
  </div>

  <div class="card">
    <div class="section-head"><span class="section-title">我的节点</span><button id="addNode" class="add-btn">＋ 添加节点</button></div>
    <div id="nodeList" class="node-list"></div>
  </div>

  <div class="card mode-card">
    <div class="mode-row">
      <label for="mode">分流模式</label>
      <select id="mode">
        <option value="chatgpt">仅 ChatGPT / OpenAI</option>
        <option value="ai">常用 AI 网站</option>
        <option value="global">浏览器全局</option>
      </select>
    </div>
    <div class="muted">推荐“仅 ChatGPT / OpenAI”，其他网站保持直连。</div>
  </div>

  <div id="toast" class="toast"></div>
  <div id="footer" class="footer">本地服务 127.0.0.1:17890</div>
</div>

<div id="editorOverlay" class="overlay">
  <div class="editor">
    <div id="editorTitle" class="editor-title">添加节点</div>
    <div class="field">
      <label for="nodeName">节点名称</label>
      <input id="nodeName" maxlength="80" placeholder="可留空，自动读取节点名称">
    </div>
    <div class="field">
      <label for="nodeSource">节点链接 / Xray JSON</label>
      <textarea id="nodeSource" placeholder="vless://...&#10;vmess://...&#10;trojan://...&#10;或完整 Xray JSON"></textarea>
      <div class="hint">支持 VLESS、VMess、Trojan；特殊参数可直接使用完整 Xray JSON。</div>
    </div>
    <div id="editorMsg" class="toast"></div>
    <div class="actions"><button id="cancelEdit" class="btn secondary">取消</button><button id="saveNode" class="btn primary">保存</button></div>
  </div>
</div>
<script src="popup.js"></script>
</body>
</html>
